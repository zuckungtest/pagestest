<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Endless Sky - Savegame Editor</title>
	
	<!-- PyScript CSS & JS -->
	<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
	<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
	
	<style>
		:root {
			--bg-color: #0f172a;
			--card-bg: #1e293b;
			--border-color: #334155;
			--text-color: #f8fafc;
			--text-muted: #94a3b8;
			
			--btn-silver-bg: #475569;
			--btn-silver-hover: #64748b;
			--btn-silver-border: #64748b;
			
			--btn-save-bg: #059669;
			--btn-save-hover: #10b981;
			--btn-save-border: #34d399;

			--input-bg: #0f172a;
			--success-bg: #064e3b;
			--success-border: #059669;
			--success-text: #6ee7b7;
		}

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			max-width: 950px;
			margin: 15px auto;
			padding: 0 15px;
			line-height: 1.4;
			background-color: var(--bg-color);
			color: var(--text-color);
		}

		.card {
			background: var(--card-bg);
			padding: 12px 15px;
			border-radius: 6px;
			border: 1px solid var(--border-color);
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
			margin-bottom: 12px;
		}

		.header-title {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 10px;
			border-bottom: 1px solid var(--border-color);
			padding-bottom: 8px;
		}

		.header-title h2 { margin: 0; font-size: 1.2em; font-weight: 600; letter-spacing: -0.02em; }

		.upload-inline {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		#file-name-display {
			font-size: 0.85em;
			color: var(--text-muted);
			font-style: italic;
		}

		.header-actions {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-top: 10px;
			padding-top: 10px;
			border-top: 1px dashed var(--border-color);
		}

		#download-section {
			background: var(--success-bg);
			border: 1px solid var(--success-border);
			color: var(--success-text);
			padding: 5px 12px;
			border-radius: 4px;
			font-size: 0.85em;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		#download-link { font-weight: 600; color: #a7f3d0; text-decoration: underline; }

		.info-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
			gap: 8px;
			background: var(--input-bg);
			padding: 8px 12px;
			border-radius: 4px;
			border: 1px solid var(--border-color);
			margin-bottom: 10px;
		}

		.info-item { display: flex; flex-direction: column; }
		.info-label { font-size: 0.68em; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.03em; }
		.info-value { font-size: 0.85em; font-weight: 600; color: var(--text-color); word-break: break-word; }

		.credits-inline {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 0.85em;
		}

		.credits-inline label { margin: 0; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
		.credits-inline input[type="number"] { width: 180px; }

		.license-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 4px 10px;
		}

		.license-checkbox {
			display: flex;
			align-items: center;
			gap: 6px;
			font-size: 0.8em;
			cursor: pointer;
			padding: 3px 6px;
			border-radius: 4px;
			border: 1px solid transparent;
		}

		.license-checkbox:hover { 
			background-color: var(--input-bg);
			border-color: var(--border-color);
		}
		
		.license-checkbox input[type="checkbox"] { 
			width: 14px; 
			height: 14px; 
			accent-color: var(--btn-save-hover); 
			cursor: pointer; 
		}

		.rep-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
		}

		table.rep-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.82em;
		}

		table.rep-table td {
			padding: 3px 4px;
			border-bottom: 1px solid var(--border-color);
		}

		table.rep-table td.faction-cell {
			width: 1%;
			white-space: nowrap;
			padding-right: 8px;
			font-weight: 500;
			color: var(--text-color);
		}

		table.rep-table td input {
			width: 80px;
			padding: 2px 4px;
			font-size: 0.9em;
		}

		.plugins-list {
			margin: 0;
			padding-left: 20px;
			font-family: 'Courier New', Courier, monospace;
			font-size: 0.85em;
			color: var(--text-color);
		}

		.plugins-list li { padding: 2px 0; }

		input[type="text"], input[type="number"], select, textarea {
			padding: 6px 10px;
			background-color: var(--input-bg);
			border: 1px solid var(--border-color);
			color: var(--text-color);
			border-radius: 4px;
			box-sizing: border-box;
			font-family: inherit;
		}

		input:focus, select:focus, textarea:focus { 
			outline: none; 
			border-color: var(--btn-silver-hover); 
		}

		select, textarea { width: 100%; }

		textarea {
			height: 280px;
			font-family: 'Courier New', Courier, monospace;
			white-space: pre;
			tab-size: 4;
			font-size: 0.85em;
		}

		.btn {
			padding: 6px 14px;
			background-color: var(--btn-silver-bg);
			color: #f8fafc;
			border: 1px solid var(--btn-silver-border);
			border-radius: 4px;
			font-weight: 600;
			font-size: 0.85em;
			cursor: pointer;
			transition: background-color 0.15s ease, border-color 0.15s ease;
			display: inline-flex;
			align-items: center;
		}

		.btn:hover { 
			background-color: var(--btn-silver-hover); 
			border-color: #cbd5e1;
		}

		.btn-save {
			background-color: var(--btn-save-bg);
			border-color: var(--btn-save-border);
			color: #ffffff;
		}

		.btn-save:hover {
			background-color: var(--btn-save-hover);
			border-color: #6ee7b7;
		}

		.add-ship-box {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-bottom: 12px;
			padding: 10px;
			background: var(--input-bg);
			border: 1px solid var(--border-color);
			border-radius: 4px;
		}

		.add-ship-controls {
			display: grid;
			grid-template-columns: 1.5fr 1.5fr 1.5fr 1fr;
			gap: 10px;
		}

		.preview-title {
			font-size: 0.75em;
			font-weight: 700;
			text-transform: uppercase;
			color: var(--text-muted);
			margin-bottom: 4px;
		}

		#add-ship-preview {
			height: 280px;
			background-color: #050b14;
			color: #a7f3d0;
		}

		.btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
		.hidden { display: none; }
	</style>
</head>
<body>

	<div class="card">
		<div class="header-title">
			<h2>Endless Sky - Savegame Editor</h2>
			<div class="upload-inline">
				<span id="file-name-display">No file chosen</span>
				<input type="file" id="file-input" accept=".txt" style="display: none;">
				<label for="file-input" class="btn">Browse File...</label>
			</div>
		</div>

		<div id="status-container" class="hidden">
			<div class="info-grid">
				<div class="info-item"><span class="info-label">Pilot</span><span class="info-value" id="info-pilot">-</span></div>
				<div class="info-item"><span class="info-label">Date</span><span class="info-value" id="info-date">-</span></div>
				<div class="info-item"><span class="info-label">System</span><span class="info-value" id="info-system">-</span></div>
				<div class="info-item"><span class="info-label">Planet</span><span class="info-value" id="info-planet">-</span></div>
				<div class="info-item"><span class="info-label">Prev. System</span><span class="info-value" id="info-prev-system">-</span></div>
				<div class="info-item"><span class="info-label">Prev. Planet</span><span class="info-value" id="info-prev-planet">-</span></div>
				<div class="info-item"><span class="info-label">Entry Method</span><span class="info-value" id="info-entry-method">-</span></div>
				<div class="info-item"><span class="info-label">File Size</span><span class="info-value" id="info-filesize">-</span></div>
			</div>

			<div class="credits-inline">
				<label for="credits-input">Credits:</label>
				<input type="number" id="credits-input">
			</div>

			<div class="header-actions">
				<button class="btn btn-save" id="save-btn">Apply Changes & Generate Savegame</button>
				
				<div id="download-section" class="hidden">
					<span>Savegame ready: </span>
					<a id="download-link" href="#" download="savegame.txt">Download File</a>
				</div>
			</div>
		</div>
	</div>

	<div id="editor-section" class="hidden">

		<div class="btn-group">
			<button class="btn" id="show-ships-btn">Ships</button>
			<button class="btn" id="show-rep-btn">Reputations</button>
			<button class="btn" id="show-lic-btn">Licenses</button>
			<button class="btn" id="show-plug-btn">Plugins</button>
		</div>

		<!-- Ships Section -->
		<div id="section-ships" class="card">
			<div class="add-ship-box">
				<div class="add-ship-controls">
					<select id="add-ship-category">
						<option value="">-- Select Category / Race --</option>
					</select>
					<select id="add-ship-model" disabled>
						<option value="">-- Select Ship Model --</option>
					</select>
					<input type="text" id="add-ship-name" placeholder="Custom Name (Optional)">
					<button class="btn" id="add-ship-btn" disabled>+ Add Ship</button>
				</div>
				<div>
					<div class="preview-title">ES Script Node Preview:</div>
					<textarea id="add-ship-preview" readonly placeholder="// Select a ship model to preview Endless Sky syntax node..."></textarea>
				</div>
			</div>

			<div style="margin-bottom: 8px;">
				<select id="ship-select">
					<option value="">-- Select owned ship --</option>
				</select>
			</div>

			<div id="ship-details" class="hidden">
				<textarea id="ship-code" spellcheck="false"></textarea>
			</div>
		</div>

		<!-- Reputations Section -->
		<div id="section-reputations" class="card hidden">
			<div class="rep-grid">
				<table class="rep-table"><tbody id="reputations-table-1"></tbody></table>
				<table class="rep-table"><tbody id="reputations-table-2"></tbody></table>
				<table class="rep-table"><tbody id="reputations-table-3"></tbody></table>
			</div>
		</div>

		<!-- Licenses Section -->
		<div id="section-licenses" class="card hidden">
			<div class="license-grid" id="license-checkbox-container"></div>
		</div>

		<!-- Plugins Section -->
		<div id="section-plugins" class="card hidden">
			<h3 style="margin-top:0; font-size: 0.9em; color: var(--text-muted);">Active Plugins in Savegame</h3>
			<ul class="plugins-list" id="plugins-list-container"></ul>
		</div>

	</div>
<script type="py" src="./editor_logic.py"></script>
</body>
</html>
