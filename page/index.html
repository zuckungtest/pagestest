<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Endless Sky - Savegame Credit Editor</title>
	
	<!-- PyScript CSS & JS einbinden -->
	<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
	<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
	
	<style>
		body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
		.field { margin-bottom: 15px; }
		label { display: block; font-weight: bold; margin-bottom: 5px; }
		input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
		button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
		button:disabled { background-color: #ccc; }
		#download-section { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; display: none; }
	</style>
</head>
<body>

	<h2>Endless Sky - Savegame Credit Editor</h2>

	<div class="field">
		<label for="file-input">Savegame auswählen (*.txt):</label>
		<input type="file" id="file-input" accept=".txt">
	</div>

	<div class="field">
		<label for="credits-input">Credits:</label>
		<input type="number" id="credits-input" disabled>
	</div>

	<button id="save-btn" disabled>Änderungen übernehmen</button>

	<div id="download-section">
		<p>Datei bereit zum Download:</p>
		<a id="download-link" href="#" download="savegame.txt">Geändertes Savegame herunterladen</a>
	</div>

	<!-- Python Code innerhalb der HTML-Datei -->
	<script type="py">
import re
import js
from pyodide.ffi import create_proxy

raw_content = ""
file_name = "savegame.txt"

async def process_file(event):
	global raw_content, file_name
	file_list = event.target.files
	if file_list.length == 0:
		return
	
	file = file_list.item(0)
	file_name = file.name
	
	# Datei-Inhalt auslesen
	text = await file.text()
	raw_content = text
	
	# Regex nach credits \d+ im Root/Account-Block
	match = re.search(r"^\tcredits (\d+)", raw_content, re.MULTILINE)
	
	credits_input = js.document.getElementById("credits-input")
	save_btn = js.document.getElementById("save-btn")
	
	if match:
		current_credits = match.group(1)
		credits_input.value = current_credits
		credits_input.disabled = False
		save_btn.disabled = False
	else:
		js.alert("Kein 'credits'-Eintrag im Savegame gefunden.")

def apply_changes(event):
	global raw_content, file_name
	new_credits = js.document.getElementById("credits-input").value
	
	# Wert per Regex ersetzen
	updated_content = re.sub(
		r"^\tcredits \d+",
		f"\tcredits {new_credits}",
		raw_content,
		flags=re.MULTILINE
	)
	
	# Blob für den File-Download in der UI erstellen
	blob = js.Blob.new([updated_content], {type: "text/plain"})
	url = js.URL.createObjectURL(blob)
	
	download_link = js.document.getElementById("download-link")
	download_link.href = url
	download_link.download = file_name
	
	js.document.getElementById("download-section").style.display = "block"

# Event-Listener an das DOM binden
file_input = js.document.getElementById("file-input")
file_input.addEventListener("change", create_proxy(process_file))

save_btn = js.document.getElementById("save-btn")
save_btn.addEventListener("click", create_proxy(apply_changes))
	</script>

</body>
</html>
